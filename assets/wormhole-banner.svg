<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Wormhole -->
    <radialGradient id="wormhole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Paths for particles -->
    <path id="leftFlow" d="M0 200 L640 200" fill="none"/>
    <path id="rightFlow" d="M1280 200 L640 200" fill="none"/>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 100h1280 M0 200h1280 M0 300h1280"/>
    <path d="M200 0v400 M400 0v400 M600 0v400 M800 0v400 M1000 0v400"/>
  </g>

  <!-- Wormhole -->
  <g transform="translate(640,200)">
    
    <!-- Pulse rings -->
    <circle r="140" stroke="#3b82f6" stroke-width="1" fill="none">
      <animate attributeName="r" values="120;150;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle r="100" fill="url(#wormhole)" opacity="0.9"/>

    <!-- Core -->
    <circle r="45" fill="#020617" stroke="#60a5fa" stroke-width="2" filter="url(#glow)"/>
  </g>

  <!-- PARTICLES (LEFT → CENTER) -->
  <circle r="3" fill="#93c5fd">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#leftFlow"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle r="2.5" fill="#60a5fa">
    <animateMotion dur="4s" repeatCount="indefinite">
      <mpath href="#leftFlow"/>
    </animateMotion>
  </circle>

  <!-- PARTICLES (RIGHT → CENTER) -->
  <circle r="3" fill="#93c5fd">
    <animateMotion dur="3.5s" repeatCount="indefinite">
      <mpath href="#rightFlow"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <circle r="2.5" fill="#60a5fa">
    <animateMotion dur="4.5s" repeatCount="indefinite">
      <mpath href="#rightFlow"/>
    </animateMotion>
  </circle>

  <!-- Title -->
  <text x="50%" y="160" text-anchor="middle"
        font-family="monospace"
        font-size="52"
        fill="#e2e8f0"
        letter-spacing="6">
    WORMHOLE
  </text>

  <!-- Subtitle -->
  <text x="50%" y="200" text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#60a5fa">
    SECURE • FAST • CROSS-CHAIN
  </text>

  <!-- Author -->
  <text x="50%" y="240" text-anchor="middle"
        font-family="monospace"
        font-size="12"
        fill="#64748b">
    by xtony.exe
  </text>

  <!-- Border -->
  <rect x="10" y="10" width="1260" height="380"
        fill="none" stroke="#334155" stroke-width="1"/>
</svg>
