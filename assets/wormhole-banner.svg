<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cyber Purple/Blue Wormhole -->
    <radialGradient id="wormhole" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="30%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Inter:wght@400;700&display=swap');
      
      .title { font-family: 'JetBrains Mono', monospace; letter-spacing: 8px; filter: url(#strongGlow); }
      .subtitle { font-family: 'Inter', sans-serif; letter-spacing: 2px; text-transform: uppercase; }
      .author { font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; }
      
      .flow {
        stroke-dasharray: 10 20;
        animation: flowAnim 3s linear infinite;
      }

      @keyframes flowAnim {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }

      .pulse-ring {
        animation: pulseAnim 4s ease-in-out infinite;
        transform-origin: center;
      }

      @keyframes pulseAnim {
        0%, 100% { transform: scale(0.95); opacity: 0.3; }
        50% { transform: scale(1.05); opacity: 0.6; }
      }

      .data-packet {
        animation: packetAnim 2.5s infinite linear;
      }
      
      @keyframes packetAnim {
        0% { opacity: 0; stroke-dashoffset: 100; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Base Layer -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Circuit Grid Background -->
  <g stroke="#1e293b" stroke-width="1" fill="none" opacity="0.5">
    <path d="M0 50h1280 M0 150h1280 M0 250h1280 M0 350h1280" />
    <path d="M100 0v400 M300 0v400 M500 0v400 M700 0v400 M900 0v400 M1100 0v400" />
  </g>

  <!-- Animated Data Flows -->
  <g stroke="#3b82f6" stroke-width="1.5" opacity="0.2">
    <path d="M100 0 v400" class="flow" />
    <path d="M1180 0 v400" class="flow" />
    <path d="M0 200 h1280" class="flow" />
  </g>

  <!-- Central Wormhole Core -->
  <g transform="translate(640, 200)">
    <!-- Pulsing Rings -->
    <circle class="pulse-ring" r="140" stroke="#6366f1" stroke-width="1" fill="none" />
    <circle class="pulse-ring" r="180" stroke="#8b5cf6" stroke-width="0.5" fill="none" style="animation-delay: -1s" />
    
    <!-- Gradient Fill -->
    <circle r="120" fill="url(#wormhole)" opacity="0.8" />
    
    <!-- Event Horizon -->
    <circle r="50" fill="#020617" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
  </g>

  <!-- Content Section -->
  <g text-anchor="middle">
    <!-- Header -->
    <text x="50%" y="160" class="title" fill="#f8fafc" font-size="56">WORMHOLE</text>
    
    <!-- Tagline Decoration -->
    <path d="M540 185 h200" stroke="#6366f1" stroke-width="2" opacity="0.5" />
    
    <!-- Subtitle -->
    <text x="50%" y="210" class="subtitle" fill="#94a3b8" font-size="14">Tunneling • Secure Transfer • Low Trace</text>
    
    <!-- Attribution Section -->
    <g transform="translate(640, 260)">
      <rect x="-80" y="-12" width="160" height="24" rx="12" fill="#1e293b" />
      <text y="5" class="author" fill="#818cf8" font-size="12">By xtony.exe</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1240" height="360" rx="4" fill="none" stroke="#334155" stroke-width="1" />
  <circle cx="35" cy="35" r="3" fill="#ef4444" />
  <circle cx="50" cy="35" r="3" fill="#f59e0b" />
  <circle cx="65" cy="35" r="3" fill="#10b981" />
</svg>
